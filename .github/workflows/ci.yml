name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

env:
  # Postgres riêng cho CI (service postgres:16 ở job e2e, database seo_test, schema seo) — KHÔNG trỏ Supabase.
  # Job check chỉ cần biến có mặt cho `prisma generate`/build (không truy vấn DB). KHÔNG có ANTHROPIC_API_KEY → không gọi Claude thật.
  DATABASE_URL: postgresql://seo:seo@localhost:5432/seo_test?schema=seo
  DIRECT_URL: postgresql://seo:seo@localhost:5432/seo_test?schema=seo
  E2E_DATABASE_URL: postgresql://seo:seo@localhost:5432/seo_test?schema=seo
  ANTHROPIC_API_KEY: ""
  ENABLE_WEB_SEARCH: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck · Unit · Build · Token lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Design-token lint (hard-coded colors)
        run: npm run lint:tokens
        # lint token bắt buộc (đã sạch từ Sprint 3)

  e2e:
    name: E2E smoke + UX gates (Playwright, Chromium, axe-core)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seo
          POSTGRES_PASSWORD: seo
          POSTGRES_DB: seo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seo -d seo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm ci cài cả devDependency @axe-core/playwright (bản ghim trong package-lock.json) cho tests/e2e/a11y.spec.ts
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright Chromium (CI only)
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
        env:
          CI: "true"
      - name: UX gate summary (trang × check)
        if: always()
        run: |
          if [ -d test-results/ux-report ]; then
            node scripts/ux-report.mjs test-results/ux-report.md
            cat test-results/ux-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      # Luôn upload: ảnh baseline (test-results/visual), báo cáo UX (test-results/ux-report*), axe JSON, trace khi fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
