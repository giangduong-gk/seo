name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  # DB SQLite riêng cho CI; KHÔNG có ANTHROPIC_API_KEY → không gọi Claude thật.
  DATABASE_URL: file:./test.db
  ANTHROPIC_API_KEY: ""
  ENABLE_WEB_SEARCH: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck · Unit · Build · Token lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Design-token lint (hard-coded colors)
        run: npm run lint:tokens
        # lint token bắt buộc (đã sạch từ Sprint 3)

  e2e:
    name: E2E smoke (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright Chromium (CI only)
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
